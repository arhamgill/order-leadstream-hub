kind = "web"
previewPath = "/"
title = "LeadStream Hub Order Portal"
version = "1.0.0"
id = "artifacts/leadstream-hub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19601

[services.development]
run = "pnpm --filter @workspace/leadstream-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/leadstream-hub", "run", "build" ]
serve = "static"
publicDir = "artifacts/leadstream-hub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19601"
BASE_PATH = "/"
